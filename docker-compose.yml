services:
  web:
    build: {context: ., dockerfile: Dockerfile}
    container_name: landing-niacinamida10
    ports: ["3002:80"]
    restart: always
    environment: [NODE_ENV=production]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.niacinamida10.rule=Host(`niacinamida10.skinoferta.cloud`)
      - traefik.http.routers.niacinamida10.entrypoints=websecure
      - traefik.http.routers.niacinamida10.tls=true
      - traefik.http.routers.niacinamida10.tls.certresolver=letsencrypt
      - traefik.http.services.niacinamida10.loadbalancer.server.port=80
    networks: [default, traefik-proxy]
networks:
  traefik-proxy:
    external: true
